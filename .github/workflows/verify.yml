name: Android verifica

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Gradle 8.9 from gradle.org, a few tries; when gradle.org does not answer (504 for GitHub's runners), the Gradle
      # already installed in the runner image is used instead (8.x, works for this build). No third-party mirrors.
      - name: Gradle
        run: |
          for url in https://downloads.gradle.org/distributions/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip; do
            curl -fsSL --retry 2 --max-time 120 -o "$RUNNER_TEMP/gradle.zip" "$url" && break
          done
          if [ -s "$RUNNER_TEMP/gradle.zip" ]; then
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          else
            echo "gradle.org not reachable: using the runner's Gradle"; command -v gradle
          fi
      - run: gradle --version
      - run: bash build.sh debug
