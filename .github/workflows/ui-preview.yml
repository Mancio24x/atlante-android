name: Android UI preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # Gradle 8.9 from gradle.org, a few tries; when gradle.org does not answer (504 for GitHub's runners), the Gradle
      # already installed in the runner image is used instead (8.x, works for this build). No third-party mirrors.
      - name: Gradle
        run: |
          for url in https://downloads.gradle.org/distributions/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip; do
            curl -fsSL --retry 2 --max-time 120 -o "$RUNNER_TEMP/gradle.zip" "$url" && break
          done
          if [ -s "$RUNNER_TEMP/gradle.zip" ]; then
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          else
            echo "gradle.org not reachable: using the runner's Gradle"; command -v gradle
          fi
      - run: gradle --version
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd locale set-app-locales app.atlante.library.debug --locales it-IT
            python3 scripts/capture-update.py
            python3 scripts/capture-widgets.py
            python3 scripts/capture-perf.py
            python3 scripts/capture-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atlante-UI-preview
          path: ui-captures/
