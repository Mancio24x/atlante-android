name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Controlla la firma persistente
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$APK_KEYSTORE_PASSWORD" ]]; then
            echo '::error::Configura i due segreti APK_KEYSTORE_BASE64 e APK_KEYSTORE_PASSWORD. Leggi README.md.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlante-release.p12"
          echo "APK_KEYSTORE_PATH=$RUNNER_TEMP/atlante-release.p12" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Installa Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Verifica la chiave
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: keytool -list -keystore "$APK_KEYSTORE_PATH" -storetype PKCS12 -alias atlante -storepass:env APK_KEYSTORE_PASSWORD
      - name: Compila e verifica l'APK firmato
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: bash build.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Atlante-Library-APK
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
      - name: Crea la release per Obtainium
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/*.apk.sha256 --clobber
          else
            gh release create "$tag" dist/*.apk dist/*.apk.sha256 --target "$GITHUB_SHA" --title "Atlante Library $VERSION_NAME" --notes 'Edizione Android offline: libreria EPUB/TXT/CBZ, copertine, mappe, lettore e avanzamento. Aggiungi questo repository a Obtainium per ricevere gli aggiornamenti.' --latest
          fi
      - name: Rimuovi la chiave dal runner
        if: always()
        run: rm -f "$RUNNER_TEMP/atlante-release.p12"
