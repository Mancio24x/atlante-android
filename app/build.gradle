plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def version = new Properties()
rootProject.file('version.properties').withInputStream { version.load(it) }
def signing = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def keyPath = System.getenv('APK_KEYSTORE_PATH') ?: signing.getProperty('storeFile')
def releasePassword = System.getenv('APK_KEYSTORE_PASSWORD') ?: signing.getProperty('storePassword')

android {
    namespace 'app.atlante.library'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'app.atlante.library'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: version.getProperty('versionCode'))
        versionName System.getenv('VERSION_NAME') ?: version.getProperty('versionName')
    }
    signingConfigs {
        release {
            if (keyPath && releasePassword) {
                storeFile rootProject.file(keyPath)
                storePassword releasePassword
                storeType 'PKCS12'
                keyAlias 'atlante'
                keyPassword releasePassword
            }
        }
    }
    buildTypes {
        release {
            // R8 removes unused library code (Compose, Material). The app's own classes are kept as they are.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'; versionNameSuffix '-debug'
            // Same R8 setup as the release, so the emulator check runs the code that reaches the phone.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { compose true }
    kotlinOptions { jvmTarget = '1.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Room schemas are exported so that every migration can be checked against the previous version.
    ksp { arg('room.schemaLocation', "$projectDir/schemas") }
    sourceSets { debug.assets.srcDirs += files("$projectDir/schemas") }   // only the debug build carries the schemas, for migration tests
    testOptions { unitTests { includeAndroidResources = true } }
    lint { abortOnError true; checkReleaseBuilds true }
}

// A release must never silently produce an unsigned APK or use a debug identity.
tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease') {
        task.doFirst {
            if (!keyPath || !releasePassword) {
                throw new GradleException('Firma mancante: configura APK_KEYSTORE_PATH e APK_KEYSTORE_PASSWORD, oppure signing.properties. Leggi README.md.')
            }
        }
    }
}

dependencies {
    // Kotlin stdlib variants pulled by AndroidX are aligned to the Kotlin used for Compose.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.0.21')
    // Jetpack Compose (screens are migrated one at a time; the rest stays on Views).
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    // Local bibliographic database (works, editions, sagas) and background work.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
